name: Apple apps

# Builds the iPhone and Apple Watch apps in Xcode (simulator, unsigned) and runs the shared Kotlin tests on an
# iOS simulator. The Android side is checked locally with ./gradlew (see README).
on:
  push:
    paths:
      - "apple/**"
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/apple.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "apple/**"
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/apple.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode:
    name: Xcode build + run in simulators
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: write # publishes screenshots to the ci/apple-screenshots branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version
          xcodegen --version

      - name: Generate Xcode project
        working-directory: apple
        run: xcodegen generate

      # The Hercules scheme builds the embedded HerculesWatch app too. Each target's pre-build script runs
      # Gradle (:shared:embedAndSignAppleFrameworkForXcode) for its SDK. arm64 only: the shared module has
      # Apple Silicon simulator targets, and macos-15 runners are Apple Silicon.
      - name: Build iPhone + Apple Watch apps
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project apple/Hercules.xcodeproj \
            -scheme Hercules \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log \
            | grep -E "error:|warning: .*\.swift|\*\* BUILD|Build shared Kotlin|> Task :shared:link|BUILD (SUCCESSFUL|FAILED)" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build/xcodebuild.log

      - name: Swift errors (if any)
        if: failure()
        run: |
          grep -nE "error:" build/xcodebuild.log | head -100 || true
          echo "-----"
          grep -nE "^e: |FAILURE|What went wrong" -A6 build/xcodebuild.log | head -80 || true

      # Boots an iPhone and an Apple Watch simulator, runs both apps with demo data, screenshots every screen and
      # fails on crashes or apps that stop running.
      - name: Run in simulators
        run: bash .github/scripts/simulator-smoke.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: shots/
          if-no-files-found: ignore

      # Also as a single force-pushed commit on ci/apple-screenshots, to look at without downloading artifacts.
      - name: Publish screenshots
        if: always() && github.event_name == 'push' && hashFiles('shots/summary.txt') != ''
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd shots
          git init -q -b ci/apple-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Simulator screenshots for ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/apple-screenshots

  kotlin-native-tests:
    name: Shared tests on iOS simulator (Kotlin/Native)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: commonTest on iosSimulatorArm64
        run: ./gradlew -Phercules.apple=true :shared:iosSimulatorArm64Test --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-native-test-reports
          path: shared/build/reports/tests/
          if-no-files-found: ignore
